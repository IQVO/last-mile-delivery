# Used by `helm lint` / `ct lint` (chart-testing): the chart refuses to render
# without the real runtime's mandatory values: a database source, the Kafka
# brokers and the three consumer groups. Dummy DSN, no password; nothing here
# is ever dialled.
database:
  url: "postgres://u@example.invalid:5432/db"
kafka:
  brokers: "kafka.example.invalid:9092"
config:
  linehaulConsumerGroup: "last-mile-delivery-linehaul"
  nodeTopologyConsumerGroup: "last-mile-delivery-node-topology"
  shippingConsumerGroup: "last-mile-delivery-shipping"
