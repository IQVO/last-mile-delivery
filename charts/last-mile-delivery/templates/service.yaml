apiVersion: v1
kind: Service
metadata:
  name: {{ include "last-mile-delivery.fullname" . }}
  labels:
    {{- include "last-mile-delivery.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  # component=api keeps this Service tied to the api pods only
  # (tests/test_service_selectors.py).
  selector:
    {{- include "last-mile-delivery.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
