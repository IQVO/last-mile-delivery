{{- if .Values.analytics.enabled }}
{{- include "last-mile-delivery.requireAnalytics" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "last-mile-delivery.reportsFullname" . }}
  labels:
    {{- include "last-mile-delivery.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytics-reports
spec:
  replicas: {{ .Values.analytics.reports.replicaCount }}
  selector:
    matchLabels:
      {{- include "last-mile-delivery.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: analytics-reports
  template:
    metadata:
      labels:
        {{- include "last-mile-delivery.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: analytics-reports
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "last-mile-delivery.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: reports
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "last-mile-delivery.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/lm-reports"]
          ports:
            - name: http
              containerPort: {{ .Values.analytics.reports.service.targetPort }}
              protocol: TCP
          # Env contract verified against cmd/lm-reports (ADR 0012). It reads
          # only the analytical database through the READER DSN (the binary's
          # ANALYTICS_DATABASE_URL fallback is for single-role local runs and is
          # deliberately not rendered); no Kafka, no OLTP DATABASE_URL.
          env:
            - name: HTTP_ADDR
              value: {{ .Values.analytics.reports.httpAddr | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.analytics.logLevel | quote }}
            - name: SERVICE_VERSION
              value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ printf "%s-reports" .Values.otel.serviceName | quote }}
            {{- end }}
            - name: ANALYTICS_READER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "last-mile-delivery.analyticsSecretName" . }}
                  key: ANALYTICS_READER_DATABASE_URL
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.analytics.reports.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- if .Values.analytics.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "last-mile-delivery.reportsFullname" . }}
  labels:
    {{- include "last-mile-delivery.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytics-reports
spec:
  type: {{ .Values.analytics.reports.service.type }}
  ports:
    - port: {{ .Values.analytics.reports.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "last-mile-delivery.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: analytics-reports
{{- end }}
